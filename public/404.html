<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · Page not found</title>
    <!-- Vercel serves this file for any path that doesn't exist, so every URL here must be absolute. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
      // Use the theme saved by the home page (dark by default, same as the site).
      try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light' } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #09090b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --dim: #52525b;
        --panel: rgba(24, 24, 27, 0.72);
        --bar: rgba(39, 39, 42, 0.6);
        --border: rgba(255, 255, 255, 0.08);
        --grid: rgba(255, 255, 255, 0.04);
        --accent: #10b981;
        --accent-fg: #052e22;
        --err: #fb7185;
      }
      [data-theme="light"] {
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #52525b;
        --dim: #a1a1aa;
        --panel: rgba(255, 255, 255, 0.82);
        --bar: rgba(244, 244, 245, 0.9);
        --border: rgba(24, 24, 27, 0.1);
        --grid: rgba(24, 24, 27, 0.05);
        --accent: #059669;
        --accent-fg: #ffffff;
        --err: #e11d48;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-height: 100%; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-x: hidden;
      }

      /* Faint grid that fades out toward the edges */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
        -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
        mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
      }

      /* Same noise overlay as the rest of the site */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
      }

      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 640px;
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 13px;
        color: var(--accent);
        letter-spacing: 0.04em;
      }

      .code {
        position: relative;
        margin: 0;
        font-size: clamp(96px, 26vw, 168px);
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      /* Short glitch every few seconds */
      .code::before,
      .code::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: 4.5s steps(1, end) infinite;
      }
      .code::before { color: var(--accent); animation-name: glitch-a; }
      .code::after { color: var(--err); animation-name: glitch-b; }

      @keyframes glitch-a {
        0%, 86% { opacity: 0; transform: none; clip-path: none; }
        87% { opacity: 0.85; transform: translate(-4px, 1px); clip-path: inset(18% 0 58% 0); }
        89% { opacity: 0.85; transform: translate(3px, -1px); clip-path: inset(62% 0 8% 0); }
        91% { opacity: 0.85; transform: translate(-2px, 0); clip-path: inset(40% 0 38% 0); }
        93%, 100% { opacity: 0; transform: none; clip-path: none; }
      }
      @keyframes glitch-b {
        0%, 87% { opacity: 0; transform: none; clip-path: none; }
        88% { opacity: 0.75; transform: translate(4px, -1px); clip-path: inset(50% 0 22% 0); }
        90% { opacity: 0.75; transform: translate(-3px, 1px); clip-path: inset(8% 0 70% 0); }
        92%, 100% { opacity: 0; transform: none; clip-path: none; }
      }

      .lead {
        margin: 16px 0 28px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }

      .term {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bar);
        font-size: 12px;
        color: var(--dim);
      }
      .bar i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--dim);
        opacity: 0.5;
      }
      .bar span { margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .screen {
        margin: 0;
        padding: 16px 16px 18px;
        min-height: 164px;
        font: inherit;
        font-size: 13px;
        line-height: 1.75;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .screen .ps { color: var(--accent); }
      .screen .err { color: var(--err); }
      .screen .ls { display: flex; flex-wrap: wrap; gap: 4px 20px; }
      .screen a { color: var(--fg); text-decoration: underline dotted var(--dim); text-underline-offset: 3px; }
      .screen a:hover { color: var(--accent); text-decoration-color: var(--accent); }

      .cursor {
        display: inline-block;
        width: 0.6em;
        height: 1.15em;
        margin-left: 1px;
        vertical-align: text-bottom;
        background: var(--accent);
        animation: blink 1.1s steps(1, end) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--fg);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: border-color 0.2s, background-color 0.2s, transform 0.2s;
      }
      .btn:hover { border-color: var(--dim); transform: translateY(-1px); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
      .btn.primary:hover { filter: brightness(1.08); }
      .btn:focus-visible, .screen a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      kbd {
        font: inherit;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid currentColor;
        opacity: 0.7;
      }

      @media (prefers-reduced-motion: reduce) {
        .code::before, .code::after, .cursor { animation: none; }
        .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">// error: route not found</p>
      <h1 class="code" data-text="404">404</h1>
      <p class="lead">Nothing lives at this address. It may have moved, or it never existed.</p>

      <div class="term">
        <div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>guest@ricardoalexander.dev: ~</span></div>
        <pre class="screen" id="screen"><span class="ps">$</span> cd this-page
<span class="err">No such file or directory</span></pre>
      </div>

      <nav class="actions">
        <a class="btn primary" href="/">cd ~ <span>back home</span> <kbd aria-hidden="true">↵</kbd></a>
        <a class="btn" href="mailto:main@ricardoalexander.dev">contact me →</a>
      </nav>
    </main>

    <script>
      (function () {
        var PROMPT = 'guest@ricardoalexander:~$ '
        var PAGES = [['home/', '/'], ['now/', '/products/now'], ['now/terms', '/products/now/terms'], ['now/privacy', '/products/now/privacy']]
        var path = location.pathname
        try { path = decodeURIComponent(path) } catch (e) {}

        var screen = document.getElementById('screen')
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var cursor = document.createElement('span')
        cursor.className = 'cursor'

        function wait(ms) { return new Promise(function (r) { setTimeout(r, reduce ? 0 : ms) }) }

        function line(cls) {
          var d = document.createElement('div')
          if (cls) d.className = cls
          screen.appendChild(d)
          return d
        }

        function promptLine() {
          var d = line()
          var ps = document.createElement('span')
          ps.className = 'ps'
          ps.textContent = PROMPT
          var text = document.createElement('span')
          d.appendChild(ps)
          d.appendChild(text)
          d.appendChild(cursor)
          return text
        }

        function type(el, str) {
          if (reduce) { el.textContent = str; return Promise.resolve() }
          // Long paths type faster so the whole thing stays under ~1.5s
          var delay = Math.max(8, Math.min(45, 1500 / str.length))
          var i = 0
          return new Promise(function (done) {
            (function next() {
              el.textContent = str.slice(0, ++i)
              if (i >= str.length) return done()
              setTimeout(next, delay * (0.6 + Math.random() * 0.8))
            })()
          })
        }

        function cmd(str) {
          var text = promptLine()
          return wait(350).then(function () { return type(text, str) }).then(function () {
            cursor.remove()
            return wait(250)
          })
        }

        function out(str, cls) {
          line(cls).textContent = str
          return wait(300)
        }

        screen.textContent = ''
        wait(300)
          .then(function () { return cmd('cd ' + path) })
          .then(function () { return out('bash: cd: ' + path + ': No such file or directory', 'err') })
          .then(function () { return cmd('ls ~') })
          .then(function () {
            var d = line('ls')
            PAGES.forEach(function (p) {
              var a = document.createElement('a')
              a.href = p[1]
              a.textContent = p[0]
              d.appendChild(a)
            })
            return wait(300)
          })
          .then(function () { promptLine() })

        // Enter goes home, unless a link is focused (then Enter follows that link)
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !(e.target.closest && e.target.closest('a, button'))) location.href = '/'
        })
      })()
    </script>
  </body>
</html>
